[project]
name = "rype-training"
version = "0.1.0"
description = "RYPE training data: synthetic instruction dataset pipeline (Phase 5) — generation, quality filtering, dedup, decontamination"
requires-python = ">=3.12"
dependencies = [
    "rype-core",
    "rype-evals",
    "pydantic>=2.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
]

[tool.uv.sources]
rype-core = { workspace = true }
rype-evals = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rype_training"]
