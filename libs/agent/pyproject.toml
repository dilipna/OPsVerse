[project]
name = "rype-agent"
version = "0.1.0"
description = "RYPE agent: a read-only Kubernetes investigation agent with a tool policy engine and trajectory evaluation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "httpx>=0.28",
    "rype-security",
]

[tool.uv.sources]
rype-security = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rype_agent"]
