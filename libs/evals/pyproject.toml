[project]
name = "rype-evals"
version = "0.1.0"
description = "RYPE evaluation: retrieval eval sets, IR metrics, ablation harness (Phase 4 grows RAGAS/DeepEval here)"
requires-python = ">=3.12"
dependencies = [
    "rype-core",
    "rype-rag",
    "rype-ingestion",
    "pydantic>=2.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "qdrant-client>=1.12",
    "anyio>=4",
]

[tool.uv.sources]
rype-core = { workspace = true }
rype-rag = { workspace = true }
rype-ingestion = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rype_evals"]
