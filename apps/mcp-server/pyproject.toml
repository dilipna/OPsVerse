[project]
name = "rype-mcp"
version = "0.1.0"
description = "RYPE MCP server: exposes platform search/chat/evals/costs to Claude Desktop, Cursor, and other MCP clients (Phase 10)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.30,<2",  # 1.30 fixes CVE-2026-116684..86, CVE-2026-59951
    "httpx>=0.28",
]

[project.scripts]
rype-mcp = "rype_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rype_mcp"]
