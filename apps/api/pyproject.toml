[project]
name = "rype-api"
version = "0.1.0"
description = "RYPE API — FastAPI service exposing ingest, search, chat, eval, and benchmark endpoints"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # safe_fetch: pinned-address transport for URL ingestion (threat model T-07)
    # <0.29: PinnedTransport replaces the private connection pool attribute.
    "httpx>=0.28,<0.29",
    "httpcore>=1.0,<2",
    "certifi",
    "uvicorn[standard]>=0.34",
    "rype-core",
    "rype-ingestion",
    "rype-rag",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "qdrant-client>=1.12",
    "arq>=0.26",
    "python-multipart>=0.0.18",
    "anyio>=4",
]

[tool.uv.sources]
rype-core = { workspace = true }
rype-ingestion = { workspace = true }
rype-rag = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rype_api"]
