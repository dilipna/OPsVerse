# Redis: cache + arq job queue + gateway budget counters. No PVC — everything
# in it is reconstructible (cache) or transient (queue); the durable spend
# record is the Postgres request_ledger.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: rype
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # the image's redis user
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: redis:7-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: data # RDB snapshots; ephemeral by design (see header)
              mountPath: /data
          ports:
            - containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: rype
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
