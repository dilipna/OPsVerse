apiVersion: v1
kind: ConfigMap
metadata:
  name: rype-config
  namespace: rype
data:
  RYPE_ENVIRONMENT: prod # ingestion fails closed without an admin key
  # Refuse model files that do not match registry/model-pins.json. Requires a pin
  # for every model in use (recorded by the "Security benchmark" workflow).
  RYPE_MODEL_PIN_MODE: enforce
  # RYPE_DATABASE_URL is set per container in api.yaml / worker.yaml: it
  # embeds DB_PASSWORD, and $(VAR) expansion does not work in ConfigMap data.
  # In-cluster service DNS names (see stateful.yaml / redis.yaml).
  RYPE_REDIS_URL: redis://redis:6379/0
  RYPE_QDRANT_URL: http://qdrant:6333
  RYPE_MINIO_ENDPOINT: http://minio:9000
  RYPE_CHAT_MODEL: gemini/gemini-3.5-flash
  RYPE_GATEWAY_DAILY_BUDGET_USD: "1.0"
---
apiVersion: v1
kind: Secret
metadata:
  name: rype-secrets
  namespace: rype
# PLACEHOLDER ONLY. In production these come from an external-secrets /
# sealed-secrets operator and are never committed. Values are base64 in a
# real Secret; stringData is used here for readability of the artifact.
type: Opaque
stringData:
  DB_PASSWORD: "change-me"
  GEMINI_API_KEY: "change-me"
  MINIO_ROOT_USER: "rype"
  MINIO_ROOT_PASSWORD: "change-me"
  ADMIN_API_KEY: "change-me" # required for /v1/ingest and /v1/security
