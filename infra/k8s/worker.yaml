# arq worker: consumes ingest/embed jobs from the Redis queue. No Service
# (nothing calls it directly). Kept at 1 replica — embedding is CPU-bound and
# the sweep self-re-enqueues, so throughput scales with CPU, not pod count.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsverse-worker
  namespace: opsverse
spec:
  replicas: 1
  selector:
    matchLabels: { app: opsverse-worker }
  template:
    metadata:
      labels: { app: opsverse-worker }
    spec:
      # Least privilege (Trivy KSV-0014/0118): non-root with a fixed UID matching
      # the image, no service-account token (nothing here calls the k8s API),
      # default seccomp profile.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/dilipna/opsverse-api:latest
          command: ["arq", "opsverse_api.worker.WorkerSettings"]
          envFrom:
            - configMapRef: { name: opsverse-config }
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: opsverse-secrets, key: DB_PASSWORD }
            # $(VAR) expansion works only inside `env`, after the variable it
            # references, never in ConfigMap data loaded with envFrom.
            - name: OPSVERSE_DATABASE_URL
              value: postgresql+asyncpg://opsverse:$(DB_PASSWORD)@postgres:5432/opsverse
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: { name: opsverse-secrets, key: GEMINI_API_KEY }
            - name: OPSVERSE_ADMIN_API_KEY
              valueFrom:
                secretKeyRef: { name: opsverse-secrets, key: ADMIN_API_KEY }
            - name: OPSVERSE_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: opsverse-secrets, key: MINIO_ROOT_USER }
            - name: OPSVERSE_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: opsverse-secrets, key: MINIO_ROOT_PASSWORD }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "2Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # The only writable path: temp files and the fastembed model cache.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 2Gi }
