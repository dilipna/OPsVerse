[project]
name = "opsverse-ai"
version = "0.1.0"
description = "OpsVerse AI — production-grade LLM engineering platform for the DevOps/MLOps/LLMOps community"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
# Application-maintained text-only compatibility exception. FastEmbed 0.8/0.9
# cap Pillow below the security-fixed release; image/PDF embedding is not part
# of this release. Validate real CPU text vectors before accepting the lock.
override-dependencies = ["pillow==13.0.0"]
constraint-dependencies = [
    "aiohttp>=3.14.4", "anyio>=4.14.2", "certifi>=2026.10.19",
    "cryptography>=50.0.0", "filelock>=4.2.1", "gitpython>=3.2.1",
    "h2>=4.4.1", "hydra-core>=1.3.7", "multidict>=6.9.1",
    "pyjwt>=2.15.0", "setuptools>=84.1.0", "soupsieve>=2.9.0", "urllib3>=2.8.0",
]

[tool.uv.workspace]
members = ["apps/api", "apps/mcp-server", "libs/*"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "aiosqlite>=0.20",
]
# Optional historical data-management CLI, not imported by application or tests.
# Its diskcache dependency has unresolved advisories. Do not install it into
# the default development/runtime environment or call its cache a secure store.
data-tools = ["dvc[s3]>=3.55"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Colab notebooks use shell magics (!pip, %cd) and interactive idioms that
# are not held to the library lint bar.
extend-exclude = ["*.ipynb"]
src = [
    "apps/api/src",
    "apps/mcp-server/src",
    "libs/core/src",
    "libs/evals/src",
    "libs/ingestion/src",
    "libs/rag/src",
    "libs/security/src",
    "libs/training/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["apps", "libs"]
exclude = ["**/.venv", "**/__pycache__", "**/alembic/versions"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "apps/api/tests",
    "apps/mcp-server/tests",
    "libs/core/tests",
    "libs/evals/tests",
    "libs/ingestion/tests",
    "libs/rag/tests",
    "libs/security/tests",
    "libs/training/tests",
    "benchmarks/tests",
    "registry/tests",
]
