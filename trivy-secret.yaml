# Trivy secret-scanner config (read by default from the repo root).
# The Security Lab parity fixture is generated by `python -m rype_agent.lab_fixtures`
# and deliberately contains synthetic, non-functional credentials: they are the inputs
# that prove the browser redactor matches the Python one. Allow only that file.
allow-rules:
  - id: lab-parity-fixture
    description: Synthetic credentials used as redactor test inputs
    path: opslm-demo/scripts/lab-fixtures\.json
