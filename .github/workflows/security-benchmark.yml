name: Security benchmark

# Manual only: downloads models and an external dataset from Hugging Face, and
# optionally calls a paid model API. Never runs on push or pull_request.
#
# - Records SHA-256 pins for the production models (rype_rag.model_integrity)
#   and prints them, so they can be reviewed and committed to
#   registry/model-pins.json.
# - Scores the injection detectors on the pinned external dataset. The LLM
#   layer runs only when the OPENROUTER_API_KEY repository secret is set;
#   without it, the regex detector is scored alone.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model id for the LLM classifier (used only if OPENROUTER_API_KEY is set)"
        default: "openai/gpt-4o-mini"
        required: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-packages --frozen

      - name: Record model pins
        run: |
          cp registry/model-pins.json /tmp/committed-pins.json 2>/dev/null || echo '{}' > /tmp/committed-pins.json
          uv run python -m rype_rag.model_integrity record \
            BAAI/bge-base-en-v1.5 Qdrant/bm25 BAAI/bge-reranker-base
          echo "----- registry/model-pins.json -----"
          cat registry/model-pins.json

      - name: Score detectors on external data
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          args="--record"
          if [ -n "$OPENROUTER_API_KEY" ]; then args="$args --model $MODEL"; fi
          uv run python -m rype_security.benchmark $args
          echo "----- evalsets/external/security-datasets.json -----"
          cat evalsets/external/security-datasets.json
          for f in docs/reports/security-*-v1-summary.json; do
            case "$f" in *classifier*|*benchmark-regex*) echo "----- $f -----"; cat "$f";; esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: security-benchmark
          path: |
            registry/model-pins.json
            evalsets/external/security-datasets.json
            docs/reports/security-classifier-v1*
            docs/reports/security-benchmark-regex-v1*
          if-no-files-found: ignore
