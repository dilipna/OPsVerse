name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runbook-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: opslm-demo/package-lock.json
      - name: Raw documents through real ingestion must match browser corpus
        run: uv run python -m opsverse_evals.runbook_fixture --check
      - run: npm ci --no-audit --no-fund
        working-directory: opslm-demo
      - run: npm test
        working-directory: opslm-demo
      - name: Rerun actual browser retrieval and both baselines
        run: node opslm-demo/scripts/evaluate-runbooks.mjs --out docs/reports/runbook-ci.json
      - name: Check fresh scenario overlap against committed training inputs
        run: uv run python -m opsverse_evals.troubleshooting_contamination --check
      - name: Check displayed evidence provenance
        run: node opslm-demo/scripts/build-study.mjs --check
      - name: Exercise frozen scenarios through the actual HTTP handler without a model
        run: node opslm-demo/scripts/model-study.mjs --label excerpts --out docs/reports/troubleshooting-ci.json
      - run: npm run build
        working-directory: opslm-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runbook-evaluation
          path: |
            docs/reports/runbook-ci.json
            docs/reports/troubleshooting-ci.json
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-packages --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest -q

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Python dependency CVEs. Advisory (report-only) on purpose: the current
      # findings are transitive dev-tooling (dvc's gitpython/diskcache), so this
      # surfaces them in the log rather than blocking on a vuln we don't ship at
      # runtime. Remove `|| true` to turn it into a hard gate.
      - name: pip-audit (dependency CVEs)
        run: uv run --with pip-audit pip-audit || true

      # Filesystem scan: known-vuln packages, leaked secrets, and IaC misconfig
      # across the repo (Dockerfile, k8s, compose). Advisory here too (exit-code 0);
      # set exit-code '1' to gate. continue-on-error keeps a transient action/network
      # issue from turning the build red on an advisory step.
      #
      # NOTE: this ref MUST carry the `v` prefix — trivy-action tags are `v0.36.0`,
      # not `0.36.0`. An unresolvable action ref fails the job at "Set up job",
      # BEFORE any step runs, so `continue-on-error` below cannot rescue it. That
      # was a silent red X on every push (fixed 2026-07-26).
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
