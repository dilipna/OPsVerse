name: CI

on:
  workflow_dispatch: # manual runs, e.g. to verify a branch before opening a PR
  push:
    branches: [main]
  pull_request:

jobs:
  runbook-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: opslm-demo/package-lock.json
      - name: Raw documents through real ingestion must match browser corpus
        run: uv run python -m rype_evals.runbook_fixture --check
      - run: npm ci --no-audit --no-fund
        working-directory: opslm-demo
      - name: npm audit (deployed runtime dependencies, blocking at high)
        run: npm audit --omit=dev --audit-level=high
        working-directory: opslm-demo
      - run: npm test
        working-directory: opslm-demo
      - name: Formatting
        run: npm run format:check
        working-directory: opslm-demo
      - name: Rerun actual browser retrieval and both baselines
        run: node opslm-demo/scripts/evaluate-runbooks.mjs --out docs/reports/runbook-ci.json
      - name: Check fresh scenario overlap against committed training inputs
        run: uv run python -m rype_evals.troubleshooting_contamination --check
      - name: Check displayed evidence provenance
        run: node opslm-demo/scripts/build-study.mjs --check
      - name: Check the security page matches committed reports and threat model
        run: node opslm-demo/scripts/build-security.mjs --check
      - name: Exercise frozen scenarios through the actual HTTP handler without a model
        run: node opslm-demo/scripts/model-study.mjs --label excerpts --out docs/reports/troubleshooting-ci.json
      - run: npm run build
        working-directory: opslm-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runbook-evaluation
          path: |
            docs/reports/runbook-ci.json
            docs/reports/troubleshooting-ci.json
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-packages --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest -q

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-packages --frozen

      # Python dependency CVEs, blocking. Accepted advisories live in a reviewed
      # register with a reason and an exit condition for each; anything new fails.
      - name: pip-audit (dependency CVEs, blocking)
        run: |
          ignores=$(grep -o '^[A-Z][A-Za-z0-9-]*' .github/security/pip-audit-accepted.txt | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          uv run --with pip-audit pip-audit --skip-editable $ignores

      # Software bill of materials for the Python runtime, from the frozen lockfile.
      - name: SBOM (CycloneDX 1.5)
        run: uv export --format cyclonedx1.5 --all-packages --frozen --no-dev -o sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

      # AI-security evals as a named step so a regression is visible in the
      # job summary, not buried in the full test run.
      - name: Security controls and detector robustness
        run: |
          uv run pytest -q libs/security apps/api/tests/test_security_controls.py
          uv run python -m rype_security.robustness --out security-report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-robustness
          path: security-report/

      # Filesystem scan: known-vulnerable packages, leaked secrets and IaC
      # misconfiguration (Dockerfiles, k8s manifests). Blocking at HIGH and
      # CRITICAL since the k8s manifests were hardened (non-root, read-only root
      # filesystem, dropped capabilities); the first clean run is what turned
      # this from advisory into a gate.
      #
      # NOTE: this ref MUST carry the `v` prefix — trivy-action tags are `v0.36.0`,
      # not `0.36.0`. An unresolvable action ref fails the job at "Set up job".
      - name: Trivy filesystem scan (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  web-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: npm audit (runtime dependencies, blocking at high)
        run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
